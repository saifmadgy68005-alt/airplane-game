
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKY FORCE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <span id="speed">SPEED: 0</span>
  <span id="altitude">ALT: 1000</span>
  <span id="direction">HDG: 000</span>
</div>

<button id="view">VIEW: TOP</button>

<div id="controls">
  <div class="joystick-base" id="joystick">
    <div class="joystick-knob" id="knob"></div>
  </div>
</div>

<div id="startScreen">
  <div class="panel">
    <h1>SKY FORCE</h1>
    <p>INFINITE FLIGHT EXPERIENCE</p>
    <button id="start">START FLIGHT</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
